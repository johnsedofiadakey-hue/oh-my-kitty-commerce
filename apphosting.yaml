runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_SITE_NAME
    value: Oh My Kitty
    availability:
      - BUILD
      - RUNTIME
  - variable: APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

