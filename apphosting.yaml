runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_SITE_NAME
    value: Oh My Kitty
    availability:
      - BUILD
      - RUNTIME
  - variable: APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ohmykitty--ohmyk1tty.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  # Firebase web config — public by design (safe to embed in the client
  # bundle and commit; these are not secrets). The Admin SDK on App Hosting
  # authenticates via the backend's attached service account (Application
  # Default Credentials), so no service-account JSON is needed here.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyATqFdRUcQQ80vhG7qgF22bCH6eHlXNEXY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ohmyk1tty.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ohmyk1tty
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ohmyk1tty.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "570285616938"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:570285616938:web:a9a1781c4c08814b61f853"
    availability:
      - BUILD
      - RUNTIME

# Paystack isn't configured yet — add PAYSTACK_SECRET_KEY and
# NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY as App Hosting secrets (not plain env vars,
# since the secret key must stay private) when the client has real keys.
# Until then the site correctly falls back to mobile money / bank transfer /
# cash — see isPaystackConfigured() in src/lib/payments/paystack.ts.
